<div class="announcement">Free shipping on orders over $100 · Everyday style, made for real life</div>
<header class="site-header">
  <div class="header-inner">
    <button class="menu-toggle" type="button" aria-label="Toggle navigation"
      [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">☰</button>
    <a class="brand" routerLink="/" (click)="closeMenu()">Thread<span>&amp;</span>Co.</a>
    <nav class="nav" [class.open]="menuOpen()" aria-label="Main navigation">
      <a routerLink="/" (click)="closeMenu()">Home</a>
      <a routerLink="/" (click)="closeMenu()">Shop all</a>
      <a routerLink="/" [queryParams]="{category: 'Tops'}" (click)="closeMenu()">Tops</a>
      <a routerLink="/" [queryParams]="{category: 'Bottoms'}" (click)="closeMenu()">Bottoms</a>
      <a routerLink="/" [queryParams]="{category: 'Outerwear'}" (click)="closeMenu()">Outerwear</a>
    </nav>
    <a class="cart-link" routerLink="/cart" aria-label="Shopping bag">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 1.9-1.4L22 8H6"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="10" cy="20" r="1.2" fill="currentColor" />
        <circle cx="18" cy="20" r="1.2" fill="currentColor" />
      </svg>
      <span>Bag</span>
      <span class="count">{{ store.cartCount() }}</span>
    </a>
  </div>
</header>
