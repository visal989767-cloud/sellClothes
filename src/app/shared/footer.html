<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <a class="brand" routerLink="/">Thread<span>&amp;</span>Co.</a>
      <p class="description">Everyday clothing for real life. Discover timeless essentials and find your own style.</p>
    </div>
    <div>
      <h2>Shop</h2>
      <a routerLink="/">All products</a>
      <a routerLink="/" [queryParams]="{category: 'Tops'}">Tops</a>
      <a routerLink="/" [queryParams]="{category: 'Bottoms'}">Bottoms</a>
      <a routerLink="/" [queryParams]="{category: 'Outerwear'}">Outerwear</a>
    </div>
    <div>
      <h2>Customer care</h2>
      <a routerLink="/orders">Order history</a>
      <a href="mailto:support@example.com">Contact us</a>
      <span>Free delivery over $100</span>
    </div>
  </div>
  <div class="footer-bottom">
    <span>© {{ year }} Thread&amp;Co.</span>
    <span>Everyday clothing. Thoughtfully chosen.</span>
  </div>
</footer>
